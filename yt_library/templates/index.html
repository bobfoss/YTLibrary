<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YT Library</title>
  <link rel="icon" href="/favicon.svg?v=ytl" type="image/svg+xml">
  <script src="/theme.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #161513;
      --panel: #211f1b;
      --ink: #f4efe7;
      --muted: #b8afa3;
      --line: #39342d;
      --accent: #67d8e6;
      --accent-soft: #173b40;
      --warn: #f4a261;
      --members-only: #2ba640;
      --members-only-bg: #102b17;
      --members-only-border: #1d5c2d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f7f4ef;
      --panel: #fffdf8;
      --ink: #25231f;
      --muted: #6b655c;
      --line: #ded6cb;
      --accent: #0b7285;
      --accent-soft: #d7f2f4;
      --warn: #9a3412;
      --members-only: #137c2a;
      --members-only-bg: #e4f5e8;
      --members-only-border: #a8d9b3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); overflow: hidden; }
    .app {
      --sidebar-min-width: 340px;
      --sidebar-max-width: min(440px, 42vw);
      display: grid;
      grid-template-columns: fit-content(var(--sidebar-max-width)) minmax(0, 1fr);
      height: 100vh;
      min-height: 0;
    }
    aside {
      width: max-content;
      min-width: var(--sidebar-min-width);
      max-width: var(--sidebar-max-width);
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 18px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    main { min-width: 0; min-height: 0; padding: 24px; display: flex; flex-direction: column; }
    h1 { font-size: 20px; margin: 0 0 14px; }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .sidebar-header h1 { margin: 0; }
    .home-title { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .home-title:hover { color: var(--ink); text-decoration: none; }
    .library-mark { width: 28px; height: 28px; flex: none; }
    .admin-link { color: var(--accent); font-size: 13px; text-decoration: none; }
    .admin-link:hover { text-decoration: underline; }
    .search { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 10px 12px; font: inherit; margin-bottom: 14px; }
    .filters { border-bottom: 1px solid var(--line); padding: 0 0 10px; margin-bottom: 14px; display: grid; gap: 7px; transition: opacity 120ms ease; }
    .filters[hidden] { display: none; }
    .search-for-filters { --search-tree-row-gap: 0; display: grid; gap: 10px; margin-bottom: 14px; }
    .search-for-filters[hidden], .search-for-filters:empty { display: none; }
    .filter-title { color: var(--muted); font-size: 12px; }
    .filter { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .filter input { accent-color: var(--accent); }
    .filter.dimmed { opacity: .42; }
    .group { width: 100%; border: 0; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; margin: 2px 0; border-radius: 6px; cursor: pointer; text-align: left; text-decoration: none; font: inherit; }
    .group:hover, .group.active { background: var(--accent-soft); }
    .primary-nav-divider { border-top: 1px solid var(--line); margin: 8px 0 6px; }
    .search-nav { margin: 0 0 4px; }
    .group-tree-row { display: grid; grid-template-columns: 14px minmax(0, 1fr); align-items: center; column-gap: 4px; padding-left: calc(var(--group-depth, 0) * 16px); }
    .group-tree-row > .group { grid-column: 2; padding-left: 4px; }
    .group-tree-row.child > .group { color: var(--muted); }
    .group-tree-row > .group-tree-toggle, .group-tree-row > .group-tree-toggle-spacer { grid-column: 1; }
    .group-tree-toggle-spacer { width: 14px; height: 18px; }
    .group-tree-children[hidden] { display: none; }
    .group-tree-label { cursor: pointer; font-weight: 600; }
    .group-section { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
    .group-section:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
    .group-section-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 0 10px 4px; }
    .count { color: var(--muted); font-size: 12px; margin-left: 8px; }
    .view-top { flex: 0 0 auto; min-width: 0; }
    .toolbar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .toolbar > .details { align-items: flex-start; justify-content: flex-end; margin-top: 0; }
    .title { font-size: 28px; line-height: 1.1; margin: 0; }
    .title-link { color: var(--ink); text-decoration: none; }
    .title-link:hover { color: var(--accent); text-decoration: none; }
    .title-with-action { display: inline-flex; align-items: center; gap: 10px; }
    .title-with-action .external-link { width: 30px; height: 30px; }
    .playlist-page-heading { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .playlist-page-meta { margin-top: 0; font-size: 13px; font-weight: 400; line-height: 1.35; }
    .meta { color: var(--muted); font-size: 14px; }

    .meta-filter.dimmed { opacity: .42; }

    .meta-filter-decorated { display: inline-flex; align-items: center; gap: 4px; }

    .search-result-meta { display: grid; gap: 8px; justify-items: end; }
    .search-result-summary { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
    .result-view-controls { display: inline-flex; align-items: center; gap: 8px; }
    .card-layout-control { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .card-layout-button { width: 32px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-right: 1px solid var(--line); padding: 0; background: var(--panel); color: var(--muted); cursor: pointer; }

    .card-layout-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .search-filter-slot { display: grid; gap: var(--search-tree-row-gap); padding: 3px 10px 5px; }
    .search-meta-kind-children.search-filter-slot { padding: 0; }
    .search-meta-kind, .search-meta-facet {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr);
      column-gap: 4px;
      row-gap: var(--search-tree-row-gap);
    }
    .search-meta-kind.kind-disabled > .search-meta-row-title { opacity: .42; }
    .search-meta-kind.kind-disabled > .search-tree-toggle { opacity: .42; }
    .search-meta-kind.kind-disabled > .search-meta-row-title .count,
    .search-meta-kind.kind-disabled .meta-filter-count { display: none; }
    .search-meta-kind-children, .search-meta-facet-children {
      grid-column: 2;
      display: grid;
      gap: var(--search-tree-row-gap);
      min-width: 0;
    }
    .search-meta-facet-children {
      grid-template-columns: 14px minmax(0, 1fr);
      column-gap: 4px;
    }
    .search-meta-facet-children > .search-tree-toggle-spacer { grid-column: 1; }
    .search-meta-facet-children > .search-meta-controls { grid-column: 2; }
    .search-meta-kind-children[hidden], .search-meta-facet-children[hidden] { display: none; }
    .search-meta-facet.dimmed { opacity: .42; }
    .search-tree-toggle {
      width: 14px;
      height: 18px;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .search-tree-toggle:hover { color: var(--ink); }
    .search-tree-toggle svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform: rotate(0deg);
      transition: transform 160ms ease;
    }
    .search-tree-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
    .search-tree-toggle-spacer { width: 14px; height: 18px; }
    .search-meta-row-title { color: var(--ink); font-size: 13px; font-weight: 650; text-align: left; display: inline-flex; align-items: center; justify-content: flex-start; gap: 4px; }
    .search-meta-row-title input { accent-color: var(--accent); margin: 0; }
    .search-kind-link { color: inherit; text-decoration: none; }
    .search-kind-link:hover { color: var(--accent); }
    .filter-parent-checkbox {
      position: relative;
      display: inline-flex;
      width: 13px;
      height: 13px;
      flex: 0 0 13px;
    }
    .filter-parent-checkbox > input { width: 13px; height: 13px; }
    .filter-parent-checkbox-indicator {
      display: none;
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      border: 1px solid var(--accent);
      border-radius: 2px;
      background: var(--accent);
      color: var(--bg);
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .filter-parent-checkbox > input:indeterminate + .filter-parent-checkbox-indicator { display: inline-flex; }
    .filter-parent-checkbox > input:focus-visible + .filter-parent-checkbox-indicator { outline: 2px solid var(--accent); outline-offset: 1px; }
    .filter-parent-checkbox-indicator svg { display: block; width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
    .search-meta-row-title .count { color: var(--muted); font-weight: 400; margin-left: 4px; }
    .search-meta-progress { display: inline-block; width: 1.4em; flex: 0 0 1.4em; text-align: left; visibility: hidden; font-weight: 400; }
    .search-meta-progress.active { visibility: visible; }
    .toolbar-heading { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    .loading-status { color: var(--muted); display: inline-flex; min-width: 8em; font-size: 14px; }
    .loading-status[hidden] { display: none; }
    .search-meta-controls { display: grid; gap: var(--search-tree-row-gap); }
    .meta-filter-nested-option { position: relative; display: grid; gap: var(--search-tree-row-gap); min-width: 0; }
    .meta-filter-nested-option > .search-tree-toggle { position: absolute; top: 0; left: -18px; }
    .meta-filter-nested-content { display: grid; gap: var(--search-tree-row-gap); margin-left: 18px; }
    .search-meta-controls .meta-filter,
    .search-meta-facet > .meta-filter { margin-left: 0; }
    .search-meta-facet .meta-filter-count { font-size: 12px; font-weight: 400; }
    .search-meta-facet .meta-filter-child { margin-left: 0; }
    .search-meta-facet.flat .meta-filter-child { margin-left: 0; }
    .playlist-search { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 7px 10px; font: inherit; min-width: min(360px, 38vw); }
    .view-sort { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; }
    .view-sort select { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 8px; font: inherit; }
    .view-top.video-collection-top .toolbar { align-items: flex-start; }
    .view-top.video-collection-top .toolbar > .details { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; }
    .view-top.video-collection-top #view-meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .video-filter-groups { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; min-width: 0; }
    .video-filter-search, .video-filter-stack, .video-filter-facet { display: contents; }
    .video-removed-filter { display: inline-flex; align-items: center; margin-left: auto; white-space: nowrap; }
    .video-filter-separator { color: var(--muted); margin-left: 8px; }
    .view-top.video-collection-top .video-collection-view-controls { grid-column: 2; white-space: nowrap; }
    .view-top.video-collection-top .view-sort { margin-left: 0; }
    @media (min-width: 761px) {
      .video-filter-groups.has-search {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
      }
      .video-filter-groups.has-search .video-filter-search {
        display: block;
        grid-column: 1;
        grid-row: 1;
      }
      .video-filter-groups.has-search .video-filter-stack {
        display: grid;
        grid-column: 2;
        grid-row: 1;
        gap: 0;
        min-width: 0;
      }
      .video-filter-groups.has-search .video-filter-facet {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        min-width: 0;
      }
    }
    .pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; color: var(--muted); font-size: 14px; margin: 0 0 14px; }
    .pager.bottom { margin: 18px 0 0; }
    .pager button, .pager select, .pager input { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 8px; font: inherit; }
    .pager button { cursor: pointer; }
    .pager button:hover:not(:disabled) { background: var(--accent-soft); }
    .pager button:disabled { opacity: .45; cursor: default; }
    .pager button.current { background: var(--accent-soft); color: var(--ink); font-weight: 650; }
    .pager .page-jumps { --page-slot-width: 42px; display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
    .pager .page-jumps button, .pager .ellipsis, .pager .page-placeholder { flex: 0 0 var(--page-slot-width); width: var(--page-slot-width); min-width: var(--page-slot-width); min-height: 32px; display: inline-flex; align-items: center; justify-content: center; }
    .pager .ellipsis { color: var(--muted); border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; }
    .pager .page-placeholder { visibility: hidden; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; }
    .pager .page-goto { display: inline-flex; align-items: center; gap: 6px; }
    .pager .page-goto input { width: 72px; }
    .view-context { flex: 0 0 auto; min-height: 0; margin-bottom: 14px; }
    .view-context[hidden] { display: none; }
    .view-top.history-top { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 760px) minmax(160px, 1fr); align-items: start; gap: 16px; margin-bottom: 14px; }
    .view-top.history-top .toolbar { display: contents; }
    .view-top.history-top .toolbar-heading {
      display: flex;
      grid-column: 1;
      grid-row: 1;
      align-items: flex-start;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .view-top.history-top .toolbar > .details { grid-column: 3; grid-row: 1; justify-self: end; align-items: center; }
    .view-top.history-top .view-context { grid-column: 2; grid-row: 1; margin-bottom: 0; }
    .results-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; padding-right: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .search-grid.layout-detailed,
    .search-grid.layout-compact { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .search-grid.layout-detailed .card,
    .search-grid.layout-compact .card { display: grid; align-items: stretch; }

    }

      aspect-ratio: 16 / 9;

    .search-grid.layout-detailed .card > .thumb-link .thumb,

    .details { color: var(--muted); font-size: 13px; margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px; }

    .badge { color: var(--warn); font-weight: 650; }

      align-items: center;
      gap: 4px;
      width: fit-content;

      background: var(--members-only-bg);
      color: var(--members-only);
      font-size: 12px;
      line-height: 1.2;
    }

      display: block;
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      fill: currentColor;
    }
    .members-only-filter { color: var(--members-only); font-weight: 650; }
    .refresh { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 7px 10px; font: inherit; cursor: pointer; }
    .refresh:hover { background: var(--accent-soft); }
    .top-link { display: inline-block; color: var(--accent); text-decoration: none; margin: -4px 0 14px; font-size: 13px; }
    .top-link:hover { text-decoration: underline; }
    .filter.child { margin-left: 18px; font-size: 13px; }
    .filter.grandchild { margin-left: 36px; font-size: 13px; }

    .history-list.layout-grid { gap: 14px; }
    .history-day-divider {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(12px, 1fr) auto minmax(12px, 1fr);
      align-items: center;
      gap: 10px;
      margin: 8px 0 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }
    .history-day-divider:first-child { margin-top: 0; }
    .history-day-divider::before,
    .history-day-divider::after { content: ''; height: 1px; background: var(--line); }
    .history-row { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: stretch; }

    .history-row .thumb { height: 84px; min-height: 84px; }
    .history-row .body { padding: 10px 12px; }
    .history-row .description { -webkit-line-clamp: 2; }
    .history-row .details.playlist-sources { margin-top: 5px; }
    .history-list.layout-detailed .history-row .description { -webkit-line-clamp: 6; }
    .history-card.history-jump-target { outline: 2px solid var(--accent); outline-offset: 2px; }
    .history-heatmap { width: min(100%, 790px); min-width: 0; margin: 0 auto; }
    .history-heatmap-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
    .history-heatmap-title { color: var(--muted); font-size: 12px; }
    .history-heatmap-nav { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .history-heatmap-sync { display: inline-flex; align-items: center; gap: 5px; margin-right: 3px; }
    .history-heatmap-sync input { margin: 0; }
    .history-heatmap-nav button { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: var(--panel); color: var(--ink); font: inherit; font-size: 17px; line-height: 1; cursor: pointer; }
    .history-heatmap-nav button svg { display: block; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .history-heatmap-nav button:hover:not(:disabled) { background: var(--accent-soft); }
    .history-heatmap-nav button:disabled { opacity: .4; cursor: default; }
    .history-heatmap-range { min-width: 112px; text-align: center; font-variant-numeric: tabular-nums; }
    .history-heatmap-scroll { max-width: 100%; overflow-x: auto; padding: 2px 0 5px; }
    .history-heatmap-calendar { position: relative; display: grid; grid-template-columns: max-content; grid-template-rows: 17px auto; width: max-content; margin: 0 auto; }
    .history-heatmap-months,
    .history-heatmap-weeks { display: grid; grid-template-columns: repeat(53, 11px); column-gap: 2px; width: max-content; padding-inline: 2px; }
    .history-heatmap-months { grid-column: 1; grid-row: 1; }
    .history-heatmap-weeks { grid-column: 1; grid-row: 2; }
    .history-heatmap-months { min-height: 17px; color: var(--muted); font-size: 11px; }
    .history-heatmap-month { white-space: nowrap; }
    .history-heatmap-week-start { position: absolute; top: 17px; right: calc(100% + 5px); color: var(--muted); font-size: 11px; line-height: 11px; white-space: nowrap; }
    .history-heatmap-week { display: grid; grid-template-rows: repeat(7, 11px); gap: 2px; }
    .history-heatmap-day { width: 11px; height: 11px; border: 0; border-radius: 2px; padding: 0; background: color-mix(in srgb, var(--line) 48%, transparent); }
    button.history-heatmap-day { cursor: pointer; }
    button.history-heatmap-day:hover,
    button.history-heatmap-day:focus-visible,
    button.history-heatmap-day[aria-current="date"] { outline: 2px solid var(--ink); outline-offset: 0; }
    .history-heatmap-day.level-1 { background: color-mix(in srgb, var(--accent) 30%, var(--panel)); }
    .history-heatmap-day.level-2 { background: color-mix(in srgb, var(--accent) 48%, var(--panel)); }
    .history-heatmap-day.level-3 { background: color-mix(in srgb, var(--accent) 68%, var(--panel)); }
    .history-heatmap-day.level-4 { background: var(--accent); }
    .video-title { color: var(--ink); font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
    .playlist-link { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
    .playlist-link:hover { text-decoration: underline; }
    .result-kind { color: var(--muted); font-size: 12px; text-transform: uppercase; margin-bottom: 5px; }
    .position { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .status { color: var(--warn); }
    .empty { color: var(--muted); padding: 36px 0; }
    .loading-dots { display: inline-block; width: 1.4em; text-align: left; }
    @media (min-width: 761px) and (max-width: 1420px) {
      .view-top.history-top { grid-template-columns: minmax(0, 1fr) auto; }
      .view-top.history-top .toolbar-heading { grid-column: 1; grid-row: 1; }
      .view-top.history-top .toolbar > .details { grid-column: 2; grid-row: 1; }
      .view-top.history-top .view-context { grid-column: 1 / -1; grid-row: 2; width: 100%; }
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
      aside { width: auto; min-width: 0; max-width: none; position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: 18px 14px; }
      .results-scroll { flex: none; overflow: visible; padding-right: 0; }
      .toolbar { display: block; }
      .search-result-meta { justify-items: start; }
      .search-result-summary { justify-content: flex-start; }
      .result-view-controls { flex-wrap: wrap; }
      .view-top.video-collection-top .toolbar > .details { flex-wrap: wrap; justify-content: flex-start; }
      .view-top.video-collection-top #view-meta { display: flex; flex-wrap: wrap; gap: 8px; }
      .view-top.video-collection-top .view-sort { margin-left: 0; }
      .view-top.history-top { display: block; margin-bottom: 0; }
      .view-top.history-top .toolbar { display: block; }
      .view-top.history-top .view-context { margin-bottom: 14px; }
      .title { font-size: 24px; margin-bottom: 6px; }
      .video-detail .detail-layout { grid-template-columns: 1fr; }
      .channel-detail .detail-layout { grid-template-columns: 1fr; }
      .search-grid.layout-detailed .card { grid-template-columns: 132px minmax(0, 1fr); }
      .search-grid.layout-compact .card { grid-template-columns: 132px minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="sidebar-header">
        <h1><a class="home-title" href="/"><img class="library-mark" src="/favicon.svg?v=ytl" alt="">YT Library</a></h1>
        <a class="admin-link" href="/admin">Admin</a>
      </div>
      <a id="history-nav" class="group" href="/history" data-key="__history__"><span>History</span><span class="count"></span></a>
      <div class="primary-nav-divider" aria-hidden="true"></div>
      <a id="search-nav" class="group search-nav" href="/search" data-key="__search__"><span>Search</span><span class="count"></span></a>
      <input id="search" class="search" type="search" placeholder="Search everything" autocomplete="off">
      <div id="search-filters" class="filters" aria-label="Search filters">
        <div class="filter-title">Search in</div>
        <div id="search-in-fields">
          <label class="filter"><input class="search-field" type="checkbox" data-search-field="titles" checked> Titles</label>
          <label class="filter"><input class="search-field" type="checkbox" data-search-field="descriptions" checked> Descriptions</label>
          <label class="filter core-library-search-field"><input class="search-field" type="checkbox" data-search-field="notes" checked> Notes</label>
          <label class="filter core-library-search-field"><input class="search-field" type="checkbox" data-search-field="tags" checked> Tags</label>
        </div>
      </div>
      <div id="search-for-filters" class="search-for-filters" aria-label="Result filters"></div>
      <nav id="groups"></nav>
    </aside>
    <main>
      <div id="view-top" class="view-top">
        <div class="toolbar">
          <div class="toolbar-heading">
            <h2 id="view-title" class="title"></h2>
            <div id="loading-status" class="loading-status" hidden aria-live="polite"></div>
          </div>
          <div class="details">
            <div id="view-meta" class="meta"></div>
            <button id="refresh" class="refresh" type="button">Refresh</button>
          </div>
        </div>
        <section id="view-context" class="view-context" hidden></section>
      </div>
      <div class="results-scroll">
        <section id="grid" class="grid"></section>
        <div id="empty" class="empty" hidden aria-live="polite">No playlists match.</div>
      </div>
      <div id="bottom-pager" class="pager bottom" hidden></div>
    </main>
  </div>
  <script src="/index.js"></script>
</body>
</html>
